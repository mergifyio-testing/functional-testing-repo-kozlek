merge_protections:
- if:
  - base=20261019071248/test_batch_failure_and_bisection/main
  name: review required
  success_conditions:
  - '#approved-reviews-by>=1'
merge_protections_settings:
  auto_merge_conditions: true
merge_queue:
  max_parallel_checks: 5
queue_rules:
- batch_max_wait_time: 0 s
  batch_size: 3
  merge_conditions:
  - status-success=continuous-integration/fake-ci
  merge_method: merge
  name: default
  queue_conditions:
  - base=20261019071248/test_batch_failure_and_bisection/main
  - label=queue
